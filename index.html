<style id="auth-overlay-style">

.user-row{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:10px 0}.user-row strong{color:#0f172a}.perm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.perm-grid label{font-size:13px;color:#334155}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.admin-actions button{border:0;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0;color:#0f172a}.danger{background:#fee2e2;color:#991b1b}

<div id="auth-overlay"><div id="auth-card"><h1>Acesso ao Sistema</h1><p>Entre com seu usuário e senha.</p><label class="auth-field">Usuário</label><input id="auth-login-user" class="auth-input" autocomplete="username"><label class="auth-field">Senha</label><input id="auth-login-pass" class="auth-input" type="password" autocomplete="current-password"><button id="auth-login-btn" class="auth-btn">Entrar</button><div id="auth-error" class="auth-error"></div></div></div>
<div id="auth-user-bar"><span id="auth-user-name" class="auth-mini"></span><button id="auth-users-btn" class="auth-mini-btn">Usuários / Permissões</button><button id="auth-logout-btn" class="auth-mini-btn">Sair</button></div>

<script id="auth-system-script">
(function(){
'use strict';
var USERS_KEY='portaria_auth_users_v2', SESSION_KEY='portaria_auth_session_v2';
function defaults(){return [{id:'admin',name:'Administrador',username:'admin',password:'admin',role:'admin',permissions:{portaria:true,patio:true,expedicao:true,historico:true,config:true}}]}
function loadUsers(){try{var x=JSON.parse(localStorage.getItem(USERS_KEY));return Array.isArray(x)&&x.length?x:defaults()}catch(e){return defaults()}}
function saveUsers(x){localStorage.setItem(USERS_KEY,JSON.stringify(x))}
function current(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){return null}}
function perms(u){return u&&u.role==='admin'?{portaria:true,patio:true,expedicao:true,historico:true,config:true}:(u&&u.permissions)||{}}
function apply(){var u=current(); if(!u){document.getElementById('auth-overlay').style.display='flex';document.getElementById('auth-user-bar').style.display='none';return} document.getElementById('auth-overlay').style.display='none';document.getElementById('auth-user-bar').style.display='flex';document.getElementById('auth-user-name').textContent='👤 '+u.name; document.getElementById('auth-users-btn').style.display=perms(u).config?'inline-block':'none'; var p=perms(u); Object.keys({portaria:1,patio:1,expedicao:1,historico:1,config:1}).forEach(function(k){var b=document.querySelector('[data-testid="nav-'+k+'"]');if(b)b.style.display=p[k]?'':'none'});}
function login(){var un=document.getElementById('auth-login-user').value.trim(),pw=document.getElementById('auth-login-pass').value, u=loadUsers().find(function(x){return x.username===un&&x.password===pw}); if(!u){document.getElementById('auth-error').textContent='Usuário ou senha inválidos.';return} localStorage.setItem(SESSION_KEY,JSON.stringify({id:u.id,name:u.name,username:u.username,role:u.role,permissions:u.permissions||{}}));document.getElementById('auth-error').textContent='';apply()}
function renderUsers(){var box=document.getElementById('user-list'), us=loadUsers();box.innerHTML='<h3 style="margin:0 0 8px">Usuários cadastrados</h3>';us.forEach(function(u){var div=document.createElement('div');div.className='user-row';var pp=perms(u);div.innerHTML='<strong>'+esc(u.name)+'</strong> — '+esc(u.username)+' ('+esc(u.role)+')<div style="font-size:12px;color:#64748b;margin-top:5px">Acessos: '+Object.keys(pp).filter(function(k){return pp[k]}).join(', ')+'</div>'+(u.id==='admin'?'':'<div class="admin-actions"><button class="danger" data-del="'+esc(u.id)+'">Excluir</button></div>');box.appendChild(div)});box.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-del');saveUsers(loadUsers().filter(function(u){return u.id!==id}));renderUsers()}})}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function openUsers(){renderUsers();document.getElementById('user-admin-panel').style.display='flex'}
function createUser(){var name=document.getElementById('new-name').value.trim(),username=document.getElementById('new-user').value.trim(),password=document.getElementById('new-pass').value,role=document.getElementById('new-role').value;if(!name||!username||!password){alert('Preencha nome, usuário e senha.');return}var us=loadUsers();if(us.some(function(u){return u.username.toLowerCase()===username.toLowerCase()})){alert('Esse usuário já existe.');return}var p={};document.querySelectorAll('[data-perm]').forEach(function(c){p[c.getAttribute('data-perm')]=c.checked});if(role==='admin')p={portaria:true,patio:true,expedicao:true,historico:true,config:true};us.push({id:'u_'+Date.now(),name:name,username:username,password:password,role:role,permissions:p});saveUsers(us);document.getElementById('new-name').value='';document.getElementById('new-user').value='';document.getElementById('new-pass').value='';renderUsers();alert('Usuário cadastrado com sucesso.')}
document.getElementById('auth-login-btn').onclick=login;document.getElementById('auth-login-pass').addEventListener('keydown',function(e){if(e.key==='Enter')login()});document.getElementById('auth-logout-btn').onclick=function(){localStorage.removeItem(SESSION_KEY);location.reload()};document.getElementById('auth-users-btn').onclick=openUsers;document.getElementById('close-users-btn').onclick=function(){document.getElementById('user-admin-panel').style.display='none'};document.getElementById('create-user-btn').onclick=createUser;
window.addEventListener('DOMContentLoaded',function(){apply();setTimeout(apply,500);setTimeout(apply,1500);var obs=new MutationObserver(function(){apply()});obs.observe(document.getElementById('root'),{childList:true,subtree:true});});
if(document.readyState!=='loading')apply();
})();
</script>
